name: release-please

# On every push to main, open or update a release PR that bumps the version
# (__version__, via the x-release-please-version marker) and CHANGELOG.md from
# the conventional commits since the last release. Merging that PR tags and
# publishes the release; nothing is released until then.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # A PAT/App token makes the release PR's pushes trigger CI, so it can
          # satisfy main's required lint-test + build checks. PRs opened with the
          # built-in GITHUB_TOKEN never trigger workflows. Falls back to
          # github.token until the RELEASE_PLEASE_PAT secret exists. Same secret
          # name as the other bench repos.
          token: ${{ secrets.RELEASE_PLEASE_PAT || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Attach the two .debs to the release: the apt repo publish picks them up
  # from there.
  debs:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build bench-setup and bench-suite
        run: sh packaging/deb/build.sh

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.deb --clobber -R "$GITHUB_REPOSITORY"
