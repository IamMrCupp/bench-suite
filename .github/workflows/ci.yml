name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --frozen: uv.lock is authoritative. A lockfile out of sync with
      # pyproject.toml fails here rather than silently resolving something else.
      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

      - name: bench-setup runs
        run: uv run bench-setup --version

  # A real Mac: the unit tests, then the read-only commands against whatever
  # the runner has. No bench apps are installed there, so this proves the Mac
  # paths run and change nothing, not that they set an app up.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pytest
        run: uv sync --frozen && uv run pytest

      - name: bench-setup doctor, obs and host run on a Mac
        run: |
          uv run bench-setup doctor | tee "$RUNNER_TEMP/doctor.txt"
          grep -q "bench-recon: no Mac app" "$RUNNER_TEMP/doctor.txt"
          uv run bench-setup obs | grep -q "OBS Virtual Camera"
          uv run bench-setup host | grep -q "is for a Linux bench"
          code=0
          uv run bench-setup services --non-interactive < /dev/null || code=$?
          test "$code" = 1

      # The real thing: the released menu-bar apps, set up by bench-setup. The
      # apps are opened on the runner's desktop session and serve for real.
      # benchhud is the stand-in the compose job uses; its Mac app has no
      # release to download yet.
      - name: Install the released benchhud-intake and bench-parts apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/apps"
          for repo in benchhud-intake bench-parts; do
            got=""
            for tag in $(gh release list -R "IamMrCupp/$repo" --exclude-drafts --exclude-pre-releases -L 5 --json tagName -q '.[].tagName'); do
              if gh release download "$tag" -R "IamMrCupp/$repo" -p '*.app.zip' -p '*.dmg' -D "$RUNNER_TEMP/apps/$repo" 2>/dev/null; then
                got=$tag; break
              fi
            done
            test -n "$got" || { echo "no release of $repo carries a Mac app"; exit 1; }
            echo "$repo $got"
            for zip in "$RUNNER_TEMP/apps/$repo"/*.zip; do
              [ -e "$zip" ] && ditto -x -k "$zip" /Applications
            done
            for dmg in "$RUNNER_TEMP/apps/$repo"/*.dmg; do
              [ -e "$dmg" ] || continue
              mount=$(mktemp -d)
              hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
              cp -R "$mount"/*.app /Applications/
              hdiutil detach "$mount" >/dev/null
            done
          done
          ls -d /Applications/bench*.app

      - name: bench-setup services sets the apps up, with no sudo
        run: |
          export BENCH_E2E_CONFIG="$RUNNER_TEMP/benchhud.toml"
          echo "BENCH_E2E_CONFIG=$BENCH_E2E_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tests/e2e/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/tests/e2e/bin:$PATH"
          openssl rand -hex 16 > "$RUNNER_TEMP/password"
          uv run bench-setup services --non-interactive < "$RUNNER_TEMP/password" | tee "$RUNNER_TEMP/services.txt"
          grep -q "benchhud-intake: set up, on 127.0.0.1:8401, benchhud wired" "$RUNNER_TEMP/services.txt"
          grep -q "bench-parts: set up, on 127.0.0.1:8402, benchhud wired" "$RUNNER_TEMP/services.txt"
          grep -q "bench-recon: has no Mac app" "$RUNNER_TEMP/services.txt"
          uv run python tests/e2e/check.py intake parts
          ! grep -qF "$(cat "$RUNNER_TEMP/password")" "$RUNNER_TEMP/services.txt"

      - name: A re-run changes nothing and leaves the apps running
        run: |
          before=$(shasum "$BENCH_E2E_CONFIG" "$HOME/Library/Application Support"/bench*/settings.env)
          uv run bench-setup services --non-interactive < /dev/null | tee "$RUNNER_TEMP/rerun.txt"
          test "$(grep -c 'already set up' "$RUNNER_TEMP/rerun.txt")" = 2
          after=$(shasum "$BENCH_E2E_CONFIG" "$HOME/Library/Application Support"/bench*/settings.env)
          test "$before" = "$after"
          pgrep -x "benchhud intake" && pgrep -x "bench parts"

      - name: doctor finds both apps healthy, and sees one that was quit
        run: |
          uv run bench-setup doctor | tee "$RUNNER_TEMP/doctor.txt"
          for name in benchhud-intake bench-parts; do
            grep -E "^  ok +$name: answering on 127\.0\.0\.1:840[12], password set, token set, benchhud wired$" "$RUNNER_TEMP/doctor.txt"
          done
          ! grep -q FAIL "$RUNNER_TEMP/doctor.txt"
          osascript -e 'tell application "bench parts" to quit'
          for _ in $(seq 20); do pgrep -x "bench parts" >/dev/null || break; sleep 0.5; done
          uv run bench-setup doctor | grep -q "bench-parts: the bench parts app isn't running"

      - name: A new token means the running app is quit and reopened
        run: |
          uv run bench-setup services --non-interactive < /dev/null
          settings="$HOME/Library/Application Support/benchhud-intake/settings.env"
          old=$(sed -n 's/^INTAKE_API_TOKEN=//p' "$settings")
          sed -i '' '/^INTAKE_API_TOKEN=/d' "$settings"
          pid=$(pgrep -x "benchhud intake")
          uv run bench-setup services --non-interactive < /dev/null | tee "$RUNNER_TEMP/retoken.txt"
          grep -q "benchhud-intake: set up" "$RUNNER_TEMP/retoken.txt"
          new=$(sed -n 's/^INTAKE_API_TOKEN=//p' "$settings")
          test -n "$new" && test "$new" != "$old"
          test "$(pgrep -x "benchhud intake")" != "$pid"
          uv run python tests/e2e/check.py intake parts

  # The compose route for real: the published service images, real docker
  # compose, no root. benchhud is a stand-in (tests/e2e/bin/benchhud); the
  # config-wiring commands are the same ones the real one takes.
  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Stand-in benchhud on PATH
        run: |
          echo "$PWD/tests/e2e/bin" >> "$GITHUB_PATH"
          echo "BENCH_E2E_CONFIG=$RUNNER_TEMP/benchhud/config.toml" >> "$GITHUB_ENV"

      - name: compose.yaml is valid
        run: docker compose -f compose.yaml config --quiet

      - name: First run sets up intake and parts, leaves recon off
        run: |
          openssl rand -hex 16 > "$RUNNER_TEMP/password"
          uv run bench-setup services --compose --non-interactive < "$RUNNER_TEMP/password"
          uv run python tests/e2e/check.py intake parts

      - name: A re-run changes nothing
        run: |
          before="$(sha256sum "$BENCH_E2E_CONFIG")"
          uv run bench-setup services --compose --non-interactive < /dev/null | tee "$RUNNER_TEMP/rerun.txt"
          test "$(grep -c 'already set up' "$RUNNER_TEMP/rerun.txt")" = 2
          test "$before" = "$(sha256sum "$BENCH_E2E_CONFIG")"

      - name: --recon turns bench-recon on
        run: |
          uv run bench-setup services --compose --non-interactive --recon < "$RUNNER_TEMP/password"
          uv run python tests/e2e/check.py intake parts recon

      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml --profile recon logs --no-color --tail 50

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml --profile recon down --volumes

  # The deb route for real. Builds this repo's two packages, puts them in a
  # local apt repo with the released benchhud and service packages, and
  # installs the lot on a clean ubuntu:26.04 running systemd as PID 1. Then an
  # ordinary user runs `sudo bench-setup services`, the way an owner would.
  deb-e2e:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Build bench-setup and bench-suite
        run: sh packaging/deb/build.sh

      - name: Fetch the released benchhud, intake, parts and recon packages
        run: |
          # The newest release that has its package. A release is published a
          # few minutes before its installers are attached, and a run in that
          # window would otherwise find nothing.
          for repo in benchhud benchhud-intake bench-parts bench-recon; do
            got=""
            for tag in $(gh release list -R "IamMrCupp/$repo" --exclude-drafts --exclude-pre-releases -L 5 --json tagName -q '.[].tagName'); do
              if gh release download "$tag" -R "IamMrCupp/$repo" -p '*amd64.deb' -D dist 2>/dev/null; then
                got=$tag; break
              fi
            done
            test -n "$got" || { echo "no release of $repo carries an amd64 .deb"; exit 1; }
            echo "$repo $got"
          done

      - name: Make a local apt repo of the six packages
        run: |
          cd dist
          ls -l
          test "$(ls *.deb | wc -l)" = 6
          dpkg-scanpackages --multiversion . > Packages

      - name: Boot ubuntu:26.04 with systemd and an ordinary user
        run: |
          printf '%s\n' \
            'FROM ubuntu:26.04' \
            'RUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends systemd systemd-sysv dbus sudo && rm -rf /var/lib/apt/lists/*' \
            'RUN useradd --create-home --shell /bin/bash bench && echo "bench ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/bench' \
            'STOPSIGNAL SIGRTMIN+3' \
            'CMD ["/sbin/init"]' > "$RUNNER_TEMP/Dockerfile.systemd"
          docker build -q -t sd -f "$RUNNER_TEMP/Dockerfile.systemd" "$RUNNER_TEMP"
          docker run -d --name sd --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw sd
          for _ in $(seq 30); do
            state=$(docker exec sd systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) break ;; esac
            sleep 1
          done
          echo "systemd: $state"
          # Not /tmp: systemd mounts a tmpfs over it, hiding what docker cp puts there.
          docker exec sd mkdir -p /opt/dist /opt/e2e
          docker cp dist/. sd:/opt/dist/
          docker cp tests/e2e/check.py sd:/opt/e2e/check.py

      - name: apt install bench-suite pulls in everything
        run: |
          docker exec sd sh -ec '
            echo "deb [trusted=yes] file:/opt/dist ./" > /etc/apt/sources.list.d/bench.list
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bench-suite
            for pkg in bench-suite bench-setup benchhud benchhud-intake bench-parts bench-recon; do
              dpkg-query -W -f "\${Package} \${Version} \${db:Status-Abbrev}\n" "$pkg"
            done
            bench-setup --version
            test -f /usr/share/bench-suite/compose.yaml
            test "$(systemctl is-enabled bench-recon || true)" = disabled
          '

      - name: Without sudo it says so and changes nothing
        run: |
          code=0
          docker exec -u bench sd bench-setup services --non-interactive < /dev/null || code=$?
          test "$code" = 2

      - name: sudo bench-setup services sets up intake and parts, leaves recon off
        run: |
          openssl rand -hex 16 > "$RUNNER_TEMP/password"
          docker exec -i -u bench -e HOME=/home/bench sd \
            sudo bench-setup services --non-interactive < "$RUNNER_TEMP/password"
          config=$(docker exec -u bench -e HOME=/home/bench sd benchhud config path)
          echo "BENCH_CONFIG=$config" >> "$GITHUB_ENV"
          docker exec -u bench -e PYTHONPATH=/usr/share/bench-setup -e BENCH_E2E_CONFIG="$config" sd \
            python3 /opt/e2e/check.py intake parts
          docker exec sd sh -ec "
            test \"\$(stat -c %U:%a '$config')\" = bench:600
            for name in benchhud-intake bench-parts; do
              test \"\$(stat -c %U:%a /var/lib/\$name/settings.env)\" = root:600
              pid=\$(systemctl show -p MainPID --value \$name)
              test \"\$(stat -c %U /proc/\$pid)\" = \$name
            done
            test \"\$(systemctl is-enabled bench-recon || true)\" = disabled
            test ! -e /var/lib/bench-recon/settings.env
          "

      - name: A re-run changes nothing
        run: |
          before=$(docker exec sd sha256sum "$BENCH_CONFIG" /var/lib/benchhud-intake/settings.env /var/lib/bench-parts/settings.env)
          docker exec -u bench -e HOME=/home/bench sd \
            sudo bench-setup services --non-interactive < /dev/null | tee "$RUNNER_TEMP/rerun.txt"
          test "$(grep -c 'already set up' "$RUNNER_TEMP/rerun.txt")" = 2
          after=$(docker exec sd sha256sum "$BENCH_CONFIG" /var/lib/benchhud-intake/settings.env /var/lib/bench-parts/settings.env)
          test "$before" = "$after"

      - name: --recon turns bench-recon on
        run: |
          docker exec -i -u bench -e HOME=/home/bench sd \
            sudo bench-setup services --non-interactive --recon < "$RUNNER_TEMP/password"
          docker exec -u bench -e PYTHONPATH=/usr/share/bench-setup -e BENCH_E2E_CONFIG="$BENCH_CONFIG" sd \
            python3 /opt/e2e/check.py intake parts recon
          docker exec sd sh -ec '
            test "$(systemctl is-enabled bench-recon)" = enabled
            # Loopback only: recon listens on 127.0.0.1:8403 and nowhere else.
            grep -E "^ *[0-9]+: 0100007F:20D3 .* 0A " /proc/net/tcp
            ! grep -qE ":20D3 .* 0A " /proc/net/tcp6
          '

      # doctor on the bench this job just built: everything on, nothing wrong
      # with the services, and no token in what it prints.
      - name: bench-setup doctor finds nothing wrong, with and without sudo
        run: |
          docker exec -u bench -e HOME=/home/bench sd sudo bench-setup doctor | tee "$RUNNER_TEMP/doctor.txt"
          for name in benchhud-intake bench-parts bench-recon; do
            grep -E "^  ok +$name: answering on 127\.0\.0\.1:840[123], password set, token set, benchhud wired$" "$RUNNER_TEMP/doctor.txt"
          done
          ! grep -q FAIL "$RUNNER_TEMP/doctor.txt"
          docker exec -u bench -e HOME=/home/bench sd bench-setup doctor | tee "$RUNNER_TEMP/doctor-user.txt"
          grep -q "password and token not checked (needs sudo)" "$RUNNER_TEMP/doctor-user.txt"
          for name in benchhud-intake bench-parts bench-recon; do
            token=$(docker exec sd sh -c "sed -n 's/^[A-Z_]*_API_TOKEN=//p' /var/lib/$name/settings.env")
            test -n "$token"
            ! grep -qF "$token" "$RUNNER_TEMP/doctor.txt" "$RUNNER_TEMP/doctor-user.txt"
          done

      # The container has no cameras, one network card and no v4l2loopback, so
      # only the report-only path is real here: it must change nothing.
      - name: bench-setup host without --yes only reports
        run: |
          before=$(docker exec sd sh -c 'ls /etc/modprobe.d /etc/modules-load.d /etc/sysctl.d | sort')
          docker exec -u bench -e HOME=/home/bench sd sudo bench-setup host --non-interactive < /dev/null | tee "$RUNNER_TEMP/host.txt"
          grep -q "only reports" "$RUNNER_TEMP/host.txt"
          grep -q "would write /etc/modprobe.d/benchhud-loopback.conf" "$RUNNER_TEMP/host.txt"
          after=$(docker exec sd sh -c 'ls /etc/modprobe.d /etc/modules-load.d /etc/sysctl.d | sort')
          test "$before" = "$after"
          docker exec -u bench -e HOME=/home/bench sd sudo bench-setup host --undo --non-interactive < /dev/null | grep -q "Nothing to undo"
          code=0
          docker exec -u bench sd bench-setup host --non-interactive < /dev/null || code=$?
          test "$code" = 2

      - name: bench-setup cameras with no cameras says so and changes nothing
        run: |
          code=0
          docker exec -u bench -e HOME=/home/bench sd sudo bench-setup cameras --non-interactive --yes < /dev/null 2> "$RUNNER_TEMP/cameras.txt" || code=$?
          cat "$RUNNER_TEMP/cameras.txt"
          test "$code" = 1
          grep -q "no USB cameras are plugged in" "$RUNNER_TEMP/cameras.txt"
          docker exec sd sh -c '! ls /etc/udev/rules.d/*benchhud* 2>/dev/null'

      - name: bench-setup obs says what to give OBS, without sudo
        run: |
          docker exec -u bench -e HOME=/home/bench sd bench-setup obs | tee "$RUNNER_TEMP/obs.txt"
          grep -q "/dev/video10: the whole HUD" "$RUNNER_TEMP/obs.txt"
          grep -q "sudo bench-setup cameras" "$RUNNER_TEMP/obs.txt"

      # Plain `sudo bench-setup` on a bench that's already set up, with no one
      # at the keyboard: every question is a no, nothing changes, doctor passes.
      - name: sudo bench-setup walks every step and changes nothing here
        run: |
          before=$(docker exec sd sh -c 'sha256sum /var/lib/*/settings.env; find /etc/modprobe.d /etc/modules-load.d /etc/sysctl.d /etc/udev/rules.d 2>/dev/null | sort; true')
          docker exec -u bench -e HOME=/home/bench sd sudo bench-setup < /dev/null | tee "$RUNNER_TEMP/guided.txt"
          for title in Services Host Cameras OBS Check; do grep -qx "== $title ==" "$RUNNER_TEMP/guided.txt"; done
          test "$(grep -c 'already set up' "$RUNNER_TEMP/guided.txt")" = 3
          ! grep -q FAIL "$RUNNER_TEMP/guided.txt"
          after=$(docker exec sd sh -c 'sha256sum /var/lib/*/settings.env; find /etc/modprobe.d /etc/modules-load.d /etc/sysctl.d /etc/udev/rules.d 2>/dev/null | sort; true')
          test "$before" = "$after"

      - name: doctor notices a service that stopped answering
        run: |
          docker exec sd systemctl stop bench-parts
          code=0
          docker exec -u bench -e HOME=/home/bench sd sudo bench-setup doctor > "$RUNNER_TEMP/doctor-down.txt" || code=$?
          cat "$RUNNER_TEMP/doctor-down.txt"
          test "$code" = 1
          grep -q "FAIL  bench-parts: nothing answers on 127.0.0.1:8402" "$RUNNER_TEMP/doctor-down.txt"

      - name: Service logs
        if: failure()
        run: |
          for name in benchhud-intake bench-parts bench-recon; do
            docker exec sd journalctl -u "$name" --no-pager -n 30 || true
          done
